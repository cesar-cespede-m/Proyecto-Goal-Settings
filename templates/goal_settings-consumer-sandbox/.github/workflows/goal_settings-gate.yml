name: goal_settings-gate

# SDLC-02.2: bloquea cambios de model-usage/ hacia main y tags v* sin evidencia Goal Settings Analytics Studio
# vigente, firmada y aprobada por personas para el commit exacto. El CI sólo verifica.
#
# Seguridad: en PRs se usa pull_request_target para que el workflow, el verificador y la
# clave pública provengan de main. Del PR sólo se lee la lista de archivos cambiados; nunca
# se ejecuta su código.

on:
  pull_request_target:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goal_settings-gate:
    name: goal_settings-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener herramientas de confianza desde main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determinar commit y alcance
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            git fetch --no-tags "$REPO_URL" "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
            echo "commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^model-usage/'; then
              echo "required=true" >> "$GITHUB_OUTPUT"
            else
              echo "required=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "commit=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sin cambios en model-usage/
        if: steps.scope.outputs.required != 'true'
        run: echo "No aplica - el PR no modifica model-usage/ y no se exige evidencia Goal Settings Analytics Studio."

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.required == 'true'
        with:
          python-version: "3.12"

      - name: Instalar verificador
        if: steps.scope.outputs.required == 'true'
        run: python -m pip install --disable-pip-version-check -r goal_settings/requirements-verifier.txt

      - name: Verificar evidencia Goal Settings Analytics Studio
        if: steps.scope.outputs.required == 'true'
        env:
          # Secreto, no variable: GitHub oculta los secretos en los registros públicos.
          EVIDENCE_B64: ${{ secrets.GOAL_SETTINGS_RELEASE_EVIDENCE_B64 }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ steps.scope.outputs.commit }}
        run: |
          evidence="$RUNNER_TEMP/release-evidence.json"
          if [ -z "$EVIDENCE_B64" ]; then
            echo "10: No hay evidencia Goal Settings Analytics Studio publicada para este repositorio" >&2
            exit 10
          fi
          if ! printf '%s' "$EVIDENCE_B64" | base64 -d > "$evidence"; then
            echo "10: La variable de evidencia no es base64 válido" >&2
            exit 10
          fi
          python goal_settings/verify_release_evidence.py "$evidence" \
            --public-key goal_settings/public-key.pem \
            --expected-repo "$EXPECTED_REPO" \
            --expected-commit "$EXPECTED_COMMIT"

  release-sandbox:
    name: release-sandbox
    if: startsWith(github.ref, 'refs/tags/v')
    needs: goal_settings-gate
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Release de prueba permitido para $GITHUB_SHA con evidencia Goal Settings Analytics Studio válida."
